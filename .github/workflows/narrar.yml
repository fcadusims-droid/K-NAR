name: narrar

# Narra um roteiro e devolve o áudio. Dispara por:
#  - Issue Form "Gerar narração" (label `narracao`)  -> a interface do usuário;
#  - workflow_dispatch                                -> teste/uso manual.
on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      titulo:
        description: "Título"
        required: false
        default: "narracao"
      script:
        description: "Roteiro (o texto a narrar)"
        required: true
      language:
        description: "Idioma: pt | en | es"
        required: false
        default: "pt"

jobs:
  narrar:
    # só roda em issues com o label `narracao` (ou em dispatch manual)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'narracao'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Monta o roteiro (roteiro.md)
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          WD_TITLE: ${{ github.event.inputs.titulo }}
          WD_SCRIPT: ${{ github.event.inputs.script }}
          WD_LANG: ${{ github.event.inputs.language }}
        run: python scripts/from_issue.py

      - name: Instala dependências (XTTS-v2)
        # o modelo (~1.8GB) é baixado no 1º uso; a síntese em CPU é lenta mas fiel.
        run: pip install --quiet numpy coqui-tts torch

      - name: Narra o roteiro
        run: python -m k_nar roteiro.md -o narracao.wav

      - name: Publica o áudio (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: narracao
          path: |
            narracao.wav
            roteiro.md

      - name: Comenta o resultado no issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '🎙️ **Sua narração está pronta!**',
                '',
                'Baixe o arquivo `narracao.wav` na aba **Artifacts** desta execução:',
                run,
                '',
                '_Gerado pelo K-NAR. Edite o issue para gerar de novo._'
              ].join('\n')
            });

      - name: Falha -> comenta o erro no issue
        if: failure() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `⚠️ Não consegui gerar a narração. Veja o log: ${run}`
            });

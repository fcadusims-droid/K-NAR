name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # A segmentação e a leitura de roteiro são stdlib; numpy cobre a montagem do
      # áudio. Os testes usam o motor 'formante' (offline) — nada de torch/XTTS.
      - name: Instala deps de teste
        run: pip install numpy
      - name: Roda a suite
        run: python -m unittest discover -s tests -v

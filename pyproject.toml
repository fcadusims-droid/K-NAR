[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "k-nar"
version = "0.2.0"
description = "Narrador privado para conteúdo de redes sociais: roteiro em texto -> um arquivo de áudio narrado (voz neural XTTS, local)."
readme = "README.md"
requires-python = ">=3.10"
# numpy é usada na montagem do áudio (a segmentação e a leitura do roteiro são stdlib).
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Voz neural de alta qualidade (local, privada). O modelo (~1.8GB) baixa no 1º uso.
# torch/torchaudio < 2.9: alinhados e sem exigir torchcodec/ffmpeg (o torch >= 2.9
# passou a exigir). transformers < 5: o coqui 0.27 usa APIs removidas no 5.x.
# Instale o torch pelo índice CPU: scripts/setup.sh --xtts (ou o índice CPU do PyTorch).
xtts = ["coqui-tts>=0.27", "torch>=2.6,<2.9", "torchaudio>=2.6,<2.9", "transformers>=4.57,<5"]
# Entrega comprimida sob limite de tamanho (Opus/MP3) via scripts/package_audio.py.
package = ["soundfile>=0.12", "lameenc>=1.7"]
dev = ["pytest", "numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["k_nar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
